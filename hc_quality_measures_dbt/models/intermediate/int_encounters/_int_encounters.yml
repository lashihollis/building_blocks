version: 2

models:
  - name: int_encounters__unioned
    description: |
      Union of all encounter data from payer and EHR sources. Patient-reported
      encounters excluded as they lack structured encounter identifiers. Encounter
      IDs are unique within a source, so the model grain includes source_system.
    columns:
      - name: encounter_id
        description: Source-specific encounter identifier
      - name: patient_id
        description: Patient identifier
      - name: encounter_date
        description: Date of the encounter
      - name: source_system
        description: Original source system
