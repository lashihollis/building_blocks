version: 2

models:
  - name: int_vitals__unioned
    description: |
      Union of all vital measurements from payer, EHR, and patient-reported sources.
      Contains duplicates across sources that will be resolved in ranking model.
    columns:
      - name: patient_id
        description: Patient identifier
      - name: encounter_id
        description: Encounter where vital was recorded (may be null)
      - name: vital_date
        description: Date vital was measured
      - name: vital_type
        description: Type of vital measurement
      - name: vital_value
        description: Numeric value of the measurement
      - name: vital_unit
        description: Unit of measurement
      - name: source_system
        description: Original source system

  - name: int_vitals__ranked
    description: |
      Candidate vital measurements ranked by configured source priority for each
      patient, date, and vital type. Rank 1 is selected by the vitals mart.
    columns:
      - name: patient_id
        description: Patient identifier
      - name: encounter_id
        description: Encounter where vital was recorded
      - name: vital_date
        description: Date vital was measured
      - name: vital_type
        description: Type of vital measurement
      - name: vital_value
        description: Numeric value of the measurement
      - name: vital_unit
        description: Unit of measurement
      - name: source_system
        description: Source system that provided the candidate measurement
      - name: source_priority_rank
        description: Configured source priority (lower values are more trusted)
      - name: source_rank
        description: Rank within patient, date, and vital type (1 = preferred)
