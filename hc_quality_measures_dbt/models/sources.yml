version: 2

sources:
  - name: healthcare_sources
    description: >-
      Generated source-format CSV fixtures checked directly from disk. The
      staging models use dbt seed models for their transformed inputs.
    meta:
      external_location: "./seeds/{name}.csv"
    tables:
      - name: source_payer_claims
        description: Payer diagnosis claims data (Highest trust for conditions).
        columns:
          - name: patient_id
            tests:
              - not_null
              - relationships:
                  to: ref('seed_patients')
                  field: patient_id
          - name: service_date
            tests:
              - not_null
          - name: icd10_code
            tests:
              - not_null

      - name: source_ehr_conditions
        description: EHR clinical condition logs (Medium trust for conditions).
        columns:
          - name: patient_id
            tests:
              - not_null
              - relationships:
                  to: ref('seed_patients')
                  field: patient_id
          - name: recorded_date
            tests:
              - not_null
          - name: condition_code
            tests:
              - not_null

      - name: source_ehr_vitals
        description: EHR recorded clinical vitals (Medium trust for physical readings).
        columns:
          - name: patient_id
            tests:
              - not_null
              - relationships:
                  to: ref('seed_patients')
                  field: patient_id
          - name: measurement_date
            tests:
              - not_null
          - name: systolic
            tests:
              - not_null
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 50
                  max_value: 300
          - name: diastolic
            tests:
              - not_null
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 20
                  max_value: 200

      - name: source_patient_reported_vitals
        description: Home app/device patient logged vitals (Lowest trust).
        columns:
          - name: patient_id
            tests:
              - not_null
              - relationships:
                  to: ref('seed_patients')
                  field: patient_id
          - name: logged_at
            tests:
              - not_null
          - name: systolic_bp
            tests:
              - not_null
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 50
                  max_value: 300
          - name: diastolic_bp
            tests:
              - not_null
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 20
                  max_value: 200
